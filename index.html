<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="A fast little space shooter game." />
		<title>Orbit Breaker</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: "Trebuchet MS", "Segoe UI", sans-serif;
				background: #070b18;
				color: #f8fafc;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-height: 100vh;
				margin: 0;
				padding: 32px 16px;
				background:
					radial-gradient(circle at 50% 0%, rgba(30, 64, 175, 0.28), transparent 38%),
					linear-gradient(145deg, #070b18 0%, #111827 55%, #172554 100%);
			}

			main {
				width: min(100%, 560px);
				margin: 0 auto;
				text-align: center;
			}

			.eyebrow {
				margin: 0 0 8px;
				color: #38bdf8;
				font-size: 0.75rem;
				font-weight: 700;
				letter-spacing: 0.18em;
				text-transform: uppercase;
			}

			h1 {
				margin: 0;
				font-size: clamp(2.25rem, 8vw, 4rem);
				line-height: 0.95;
				letter-spacing: 0.02em;
			}

			.subtitle {
				margin: 14px 0 22px;
				color: #cbd5e1;
			}

			.game-frame {
				position: relative;
				padding: 10px;
				border: 1px solid rgba(125, 211, 252, 0.35);
				background: rgba(15, 23, 42, 0.72);
				box-shadow: 0 24px 70px rgba(2, 6, 23, 0.55);
			}

			.game-frame canvas {
				max-width: 100%;
				height: auto;
				margin: 0 auto !important;
			}

			.start-modal {
				position: absolute;
				inset: 10px;
				display: grid;
				place-items: center;
				padding: 24px;
				background: rgba(7, 11, 24, 0.82);
				text-align: center;
				z-index: 1;
			}

			.start-modal[hidden] {
				display: none;
			}

			.start-modal h2 {
				margin: 0 0 10px;
				font-size: 2rem;
			}

			.start-modal p {
				margin: 0 0 20px;
				color: #cbd5e1;
			}

			.start-button {
				padding: 12px 24px;
				border: 0;
				border-radius: 6px;
				background: #38bdf8;
				color: #082f49;
				cursor: pointer;
				font: inherit;
				font-weight: 700;
			}

			.start-button:hover,
			.start-button:focus-visible {
				background: #7dd3fc;
			}

			.instructions {
				display: flex;
				justify-content: center;
				gap: 18px;
				margin: 18px 0 0;
				color: #94a3b8;
				font-size: 0.875rem;
			}

			kbd {
				padding: 2px 6px;
				border: 1px solid #475569;
				border-radius: 4px;
				background: #1e293b;
				color: #f8fafc;
				font-family: inherit;
				font-size: 0.8em;
			}

			@media (max-width: 520px) {
				body {
					padding: 22px 8px;
				}

				.instructions {
					flex-wrap: wrap;
					gap: 8px 14px;
				}
			}
		</style>
		<script src="./hfbh.js" defer></script>
	</head>
	<body>
		<main>
			<p class="eyebrow">Arcade // Sector 07</p>
			<h1>Orbit Breaker</h1>
			<p class="subtitle">Pilot the last ship. Break the falling wave.</p>
			<section class="game-frame" aria-label="Orbit Breaker game">
				<div class="start-modal" role="dialog" aria-modal="true" aria-labelledby="start-title">
					<div>
						<h2 id="start-title">Ready, pilot?</h2>
						<p>Move with A/D or the arrow keys, then fire with Space.</p>
						<button class="start-button" type="button">Start Game</button>
					</div>
				</div>
				<!-- The game canvas is mounted here by hfbh.js. -->
			</section>
			<div class="instructions" aria-label="Game controls">
				<span><kbd>A</kbd> <kbd>D</kbd> or arrows to move</span>
				<span><kbd>Space</kbd> to fire</span>
			</div>
		</main>
	</body>
</html>
